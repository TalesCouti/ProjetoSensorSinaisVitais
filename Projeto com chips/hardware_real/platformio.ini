; Opcional: compilar/gravar com PlatformIO (VS Code) em vez da Arduino IDE.
; O código fica em VitalSenseESP32/ (a mesma pasta que a Arduino IDE abre).
;   pio run -t upload
;   pio device monitor
; Antes: copie VitalSenseESP32/config.example.h para VitalSenseESP32/config.h.

[platformio]
src_dir = VitalSenseESP32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
  adafruit/Adafruit SSD1306@^2.5.7
  adafruit/Adafruit GFX Library@^1.11.5
  bblanchon/ArduinoJson@^7.0.4
